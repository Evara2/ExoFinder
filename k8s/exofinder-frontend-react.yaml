apiVersion: apps/v1
kind: Deployment
metadata:
  name: exofinder-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exofinder-frontend
  template:
    metadata:
      labels:
        app: exofinder-frontend
    spec:
      containers:
        - name: frontend
          image: exofinder-frontend:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: exofinder-frontend
spec:
  type: NodePort
  selector:
    app: exofinder-frontend
  ports:
    - port: 80
      targetPort: 80
