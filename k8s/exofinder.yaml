apiVersion: apps/v1
kind: Deployment
metadata:
  name: exofinder-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exofinder-api
  template:
    metadata:
      labels:
        app: exofinder-api
    spec:
      containers:
      - name: api
        image: exofinder-api:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: exofinder-api
spec:
  selector:
    app: exofinder-api
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exofinder-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exofinder-frontend
  template:
    metadata:
      labels:
        app: exofinder-frontend
    spec:
      containers:
      - name: frontend
        image: exofinder-frontend:1.0
        imagePullPolicy: IfNotPresent
        env:
        - name: API_URL
          value: http://exofinder-api:8000
        ports:
        - containerPort: 8501
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: exofinder-frontend
spec:
  type: NodePort
  selector:
    app: exofinder-frontend
  ports:
  - port: 8501
    targetPort: 8501
