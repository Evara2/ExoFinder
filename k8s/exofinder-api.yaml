apiVersion: apps/v1
kind: Deployment
metadata:
  name: exofinder-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exofinder-api
  template:
    metadata:
      labels:
        app: exofinder-api
    spec:
      containers:
      - name: api
        image: exofinder-api:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi

---

apiVersion: v1
kind: Service
metadata:
  name: exofinder-api
spec:
  selector:
    app: exofinder-api
  ports:
  - port: 8000
    targetPort: 8000

